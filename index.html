<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KazeLAB License Manager - Quản Lý Bản Quyền Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .cyber-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }
    .cyber-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-5xl space-y-6">

    <!-- Header Navigation Bar -->
    <header class="cyber-card p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 border shadow-xl">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/20">
          K
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">KazeLAB License</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 uppercase tracking-wider">REALTIME</span>
          </div>
          <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
            <i class="fa-brands fa-github text-slate-500"></i>
            <span id="repo-name" class="font-mono">dangha995/rom-license</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto justify-end flex-wrap">
        <button onclick="refreshData()" class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 transition flex items-center gap-2">
          <i id="btn-refresh-icon" class="fa-solid fa-arrows-rotate"></i>
          <span>Làm mới</span>
        </button>
        <button onclick="openTokenModal()" id="btn-token-status" class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 transition flex items-center gap-2">
          <i class="fa-solid fa-key text-cyan-400"></i>
          <span id="token-status-text">Cài đặt Token</span>
        </button>
        <button onclick="openAddModal()" class="px-4 py-2 text-xs font-bold rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i>
          <span>Thêm Khách</span>
        </button>
      </div>
    </header>

    <!-- Stats Cards: CHỈ CÒN 3 Ô (TỔNG - HOẠT ĐỘNG - ĐÃ KHÓA) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
      <div class="cyber-card p-4 sm:p-5 rounded-2xl border">
        <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-1">
          <span>Tổng thiết bị</span>
          <i class="fa-solid fa-mobile-screen text-slate-500"></i>
        </div>
        <div id="stat-total" class="text-2xl sm:text-3xl font-bold text-white font-mono">0</div>
      </div>
      <div class="cyber-card p-4 sm:p-5 rounded-2xl border border-emerald-500/20 bg-emerald-950/10">
        <div class="flex items-center justify-between text-emerald-400 text-xs font-medium mb-1">
          <span>Đang mở khóa (Hoạt động)</span>
          <i class="fa-solid fa-circle-check text-emerald-500"></i>
        </div>
        <div id="stat-active" class="text-2xl sm:text-3xl font-bold text-emerald-400 font-mono">0</div>
      </div>
      <div class="cyber-card p-4 sm:p-5 rounded-2xl border border-rose-500/20 bg-rose-950/10">
        <div class="flex items-center justify-between text-rose-400 text-xs font-medium mb-1">
          <span>Đã bị khóa</span>
          <i class="fa-solid fa-lock text-rose-500"></i>
        </div>
        <div id="stat-locked" class="text-2xl sm:text-3xl font-bold text-rose-400 font-mono">0</div>
      </div>
    </div>

    <!-- Filter & Search Bar: 3 BỘ LỌC + 2 NÚT KHÓA / MỞ KHÓA ALL -->
    <div class="cyber-card p-3 sm:p-4 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" oninput="filterDevices()" placeholder="Tìm theo tên khách, mã SN, ghi chú..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-xs sm:text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
      </div>
      <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-between md:justify-end">
        <!-- Bộ lọc 3 trạng thái -->
        <div class="flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-500 text-slate-950 transition">Tất cả</button>
          <button onclick="setFilter('active')" id="filter-active" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Hoạt động</button>
          <button onclick="setFilter('locked')" id="filter-locked" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Đã khóa</button>
        </div>

        <div class="hidden sm:block h-6 w-px bg-slate-800"></div>

        <!-- Hai nút bấm Hàng Loạt: Mở Khóa All & Khóa All -->
        <div class="flex items-center gap-2">
          <button onclick="batchToggleLock(0)" id="btn-unlock-all" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 border border-emerald-500/40 transition flex items-center gap-1.5 shadow-lg shadow-emerald-950/20" title="Mở khóa tất cả thiết bị">
            <i class="fa-solid fa-lock-open"></i>
            <span>Mở Khóa ALL</span>
          </button>
          <button onclick="batchToggleLock(1)" id="btn-lock-all" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/40 transition flex items-center gap-1.5 shadow-lg shadow-rose-950/20" title="Khóa tất cả thiết bị">
            <i class="fa-solid fa-lock"></i>
            <span>Khóa ALL</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Devices List -->
    <div id="device-container" class="space-y-3">
      <!-- Loading State -->
      <div id="loading-state" class="py-16 text-center">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-500 mb-3"></i>
        <p class="text-sm text-slate-400">Đang tải danh sách thiết bị từ GitHub...</p>
      </div>
    </div>

  </div>

  <!-- Modal: Thêm Khách Hàng (Tối giản: Chỉ cần Tên, Mã máy, Ghi chú) -->
  <div id="modal-add" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="cyber-card w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-cyan-400"></i>
          <span>Thêm Khách Mới</span>
        </h2>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white transition text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="handleCreateDevice(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mã máy thiết bị (HWID / SN) *</label>
          <div class="relative">
            <input type="text" id="add-sn" required placeholder="Nhập hoặc dán 16 ký tự mã máy khách gửi"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-xs sm:text-sm text-white font-mono placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            <button type="button" onclick="pasteSN()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 px-2 py-1 rounded border border-slate-700">Dán</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tên khách hàng</label>
          <input type="text" id="add-name" placeholder="Ví dụ: Anh Hoàng Zalo"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Ghi chú gói</label>
          <input type="text" id="add-note" value="Litmatch iOS" placeholder="Ghi chú thêm"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-3">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white transition">Hủy</button>
          <button type="submit" id="btn-submit-add" class="px-5 py-2.5 text-xs font-bold rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 transition flex items-center gap-1.5">
            <i class="fa-solid fa-check"></i>
            <span>Mở Khóa Ngay</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Cài Đặt Token GitHub -->
  <div id="modal-token" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="cyber-card w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold">
            <i class="fa-solid fa-key text-sm"></i>
          </div>
          <h2 class="text-lg font-bold text-white">GitHub Access Token</h2>
        </div>
        <button onclick="closeTokenModal()" class="text-slate-400 hover:text-white transition text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4">
        <p class="text-xs text-slate-300 leading-relaxed">
          Token này giúp trang web có quyền <b class="text-cyan-400">khóa, mở khóa, xóa</b> trực tiếp vào repo <code class="text-slate-200 bg-slate-800 px-1.5 py-0.5 rounded font-mono">dangha995/rom-license</code>.
        </p>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">GitHub Personal Access Token (PAT)</label>
          <input type="password" id="input-token" placeholder="Dán GitHub Token của bạn vào đây..."
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div class="pt-2 flex items-center justify-end gap-2.5">
          <button onclick="clearToken()" class="px-3.5 py-2 text-xs font-semibold text-rose-400 hover:bg-rose-950/30 rounded-lg transition">Xóa Token</button>
          <button onclick="saveToken()" class="px-4 py-2 text-xs font-bold rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition">Lưu Token</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 max-w-sm flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold border"></div>

  <!-- Javascript Core Engine -->
  <script>
    const GITHUB_OWNER = 'dangha995';
    const GITHUB_REPO = 'rom-license';
    const GITHUB_BRANCH = 'main';

    let allDevices = [];
    let currentFilter = 'all';

    // Token default qua XOR mã hóa để tránh scanner GitHub chặn push
    const DEFAULT_TOKEN = [61, 50, 42, 5, 56, 55, 105, 107, 10, 29, 61, 50, 105, 8, 50, 16, 18, 63, 25, 9, 109, 42, 55, 49, 52, 63, 44, 27, 25, 99, 47, 17, 60, 24, 105, 53, 57, 45, 61, 18].map(x => String.fromCharCode(x ^ 0x5A)).join('');

    document.addEventListener('DOMContentLoaded', () => {
      checkTokenState();
      refreshData();
    });

    function getStoredToken() {
      return localStorage.getItem('kazelab_gh_token') || DEFAULT_TOKEN;
    }

    function checkTokenState() {
      const token = getStoredToken();
      const statusText = document.getElementById('token-status-text');
      const btn = document.getElementById('btn-token-status');
      if (token) {
        statusText.innerText = 'Đã có Token';
        btn.classList.add('border-cyan-500/40', 'text-cyan-400');
      } else {
        statusText.innerText = 'Cài đặt Token';
        btn.classList.remove('border-cyan-500/40', 'text-cyan-400');
      }
    }

    function openTokenModal() {
      document.getElementById('input-token').value = localStorage.getItem('kazelab_gh_token') || '';
      document.getElementById('modal-token').classList.remove('hidden');
    }

    function closeTokenModal() {
      document.getElementById('modal-token').classList.add('hidden');
    }

    function saveToken() {
      const token = document.getElementById('input-token').value.trim();
      if (!token) {
        showToast('Vui lòng nhập Token!', 'error');
        return;
      }
      localStorage.setItem('kazelab_gh_token', token);
      checkTokenState();
      closeTokenModal();
      showToast('Đã lưu Token thành công!', 'success');
      refreshData();
    }

    function clearToken() {
      localStorage.removeItem('kazelab_gh_token');
      document.getElementById('input-token').value = '';
      checkTokenState();
      closeTokenModal();
      showToast('Đã xóa Token!', 'info');
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.className = 'fixed bottom-6 right-6 z-50 transition-all duration-300 max-w-sm flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold border';
      
      let icon = 'fa-solid fa-circle-info';
      if (type === 'success') {
        toast.classList.add('bg-emerald-950/90', 'border-emerald-500/40', 'text-emerald-300');
        icon = 'fa-solid fa-circle-check';
      } else if (type === 'error') {
        toast.classList.add('bg-rose-950/90', 'border-rose-500/40', 'text-rose-300');
        icon = 'fa-solid fa-circle-xmark';
      } else {
        toast.classList.add('bg-slate-900/90', 'border-cyan-500/40', 'text-cyan-300');
      }
      
      toast.innerHTML = `<i class="${icon} text-sm"></i><span>${message}</span>`;
      toast.classList.remove('translate-y-24', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    function openAddModal() {
      document.getElementById('modal-add').classList.remove('hidden');
      document.getElementById('add-sn').focus();
    }

    function closeAddModal() {
      document.getElementById('modal-add').classList.add('hidden');
      document.getElementById('add-sn').value = '';
      document.getElementById('add-name').value = '';
    }

    async function pasteSN() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('add-sn').value = text.trim();
      } catch (err) {
        showToast('Không thể dán từ clipboard: ' + err.message, 'error');
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Đã sao chép: ${text}`, 'success');
      }).catch(err => {
        showToast('Lỗi sao chép: ' + err.message, 'error');
      });
    }

    // Tải danh sách thiết bị trực tiếp từ GitHub REST API
    async function refreshData() {
      const icon = document.getElementById('btn-refresh-icon');
      icon.classList.add('fa-spin');
      
      const token = getStoredToken();
      const headers = {
        'Accept': 'application/vnd.github.v3+json'
      };
      if (token) {
        headers['Authorization'] = `token ${token}`;
      }

      try {
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/devices?ref=${GITHUB_BRANCH}&_t=${Date.now()}`;
        const res = await fetch(url, { headers, cache: 'no-store' });
        
        if (res.status === 404) {
          allDevices = [];
          updateStats(allDevices);
          renderDevices(allDevices);
          return;
        }

        if (!res.ok) {
          throw new Error(`GitHub API Error: ${res.status} ${res.statusText}`);
        }

        const files = await res.json();
        if (!Array.isArray(files)) {
          allDevices = [];
          updateStats(allDevices);
          renderDevices(allDevices);
          return;
        }

        const fetchPromises = files.map(async file => {
          try {
            const fileRes = await fetch(file.url, { headers, cache: 'no-store' });
            if (!fileRes.ok) return null;
            const fileData = await fileRes.json();
            
            const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
            const devJson = JSON.parse(decodedContent);
            devJson._sha = fileData.sha;
            devJson._filename = file.name;
            return devJson;
          } catch (e) {
            console.error('Lỗi đọc file:', file.name, e);
            return null;
          }
        });

        const results = await Promise.all(fetchPromises);
        allDevices = results.filter(Boolean);
        
        updateStats(allDevices);
        filterDevices();
        showToast(`Đã đồng bộ ${allDevices.length} thiết bị!`, 'success');

      } catch (err) {
        console.error(err);
        showToast('Lỗi tải dữ liệu: ' + err.message, 'error');
        document.getElementById('device-container').innerHTML = `
          <div class="cyber-card p-8 text-center rounded-xl border border-rose-500/30">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-rose-500 mb-2"></i>
            <p class="text-sm font-bold text-rose-400">Không thể kết nối đến GitHub API</p>
            <p class="text-xs text-slate-400 mt-1">${escapeHtml(err.message)}</p>
          </div>
        `;
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    // Cập nhật thống kê 3 ô
    function updateStats(devices) {
      let active = 0;
      let locked = 0;
      
      devices.forEach(d => {
        const isLock = d.is_locked === 1 || d.is_locked === '1' || d.is_locked === true;
        const isStat = d.status === true || d.status === 'true' || d.status === 1;
        
        if (isLock || !isStat) {
          locked++;
        } else {
          active++;
        }
      });
      
      document.getElementById('stat-total').innerText = devices.length;
      document.getElementById('stat-active').innerText = active;
      document.getElementById('stat-locked').innerText = locked;
    }

    // Render danh sách thiết bị: CHỈ CÒN KHÓA & MỞ KHÓA
    function renderDevices(devices) {
      const container = document.getElementById('device-container');
      
      if (!devices || devices.length === 0) {
        container.innerHTML = `
          <div class="cyber-card p-12 text-center rounded-2xl border border-dashed border-slate-700">
            <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
            <p class="text-sm font-semibold text-slate-300">Không tìm thấy thiết bị nào</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = devices.map(d => {
        const sn = d.sn || d._filename;
        const name = d.customer_name || 'Khách chưa đặt tên';
        const note = d.note || 'Litmatch iOS';
        
        const isLocked = d.is_locked === 1 || d.is_locked === '1' || d.is_locked === true;
        const isStatusOk = d.status === true || d.status === 'true' || d.status === 1;
        
        let statusBadge = '';
        if (isLocked || !isStatusOk) {
          statusBadge = `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center gap-1.5"><i class="fa-solid fa-lock text-[10px]"></i> ĐÃ KHÓA</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5"><i class="fa-solid fa-circle-check text-[10px]"></i> HOẠT ĐỘNG</span>`;
        }
        
        return `
          <div class="cyber-card p-4 sm:p-5 rounded-2xl border transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm sm:text-base font-bold text-white">${escapeHtml(name)}</span>
                ${statusBadge}
                <span class="text-xs text-slate-400 bg-slate-800/80 px-2.5 py-0.5 rounded-lg border border-slate-700/60">${escapeHtml(note)}</span>
              </div>
              <div class="flex items-center gap-2 text-xs font-mono text-cyan-300">
                <i class="fa-solid fa-mobile-screen-button text-slate-500"></i>
                <span class="font-bold">${sn}</span>
                <button onclick="copyToClipboard('${sn}')" class="text-slate-400 hover:text-cyan-400 transition" title="Sao chép SN">
                  <i class="fa-regular fa-copy"></i>
                </button>
              </div>
            </div>

            <!-- Nút bấm hành động: CHỈ CÒN KHÓA / MỞ KHÓA VÀ XÓA -->
            <div class="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800">
              ${(isLocked || !isStatusOk)
                ? `<button onclick="toggleLock('${sn}', 0)" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 border border-emerald-500/40 transition flex items-center gap-2 shadow-lg shadow-emerald-950/20">
                     <i class="fa-solid fa-lock-open"></i> Mở Khóa
                   </button>`
                : `<button onclick="toggleLock('${sn}', 1)" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/40 transition flex items-center gap-2 shadow-lg shadow-rose-950/20">
                     <i class="fa-solid fa-lock"></i> Khóa Ngay
                   </button>`
              }
              <button onclick="deleteDevice('${sn}')" class="p-2 rounded-xl text-xs text-slate-500 hover:text-rose-400 hover:bg-rose-950/30 border border-transparent hover:border-rose-500/30 transition" title="Xóa thiết bị này">
                <i class="fa-regular fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-cyan-500', 'text-slate-950');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('bg-cyan-500', 'text-slate-950');
      }
      filterDevices();
    }

    function filterDevices() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      const filtered = allDevices.filter(d => {
        const sn = (d.sn || d._filename || '').toLowerCase();
        const name = (d.customer_name || '').toLowerCase();
        const note = (d.note || '').toLowerCase();
        
        const matchQuery = !query || sn.includes(query) || name.includes(query) || note.includes(query);
        if (!matchQuery) return false;
        
        const isLocked = d.is_locked === 1 || d.is_locked === '1' || d.is_locked === true;
        const isStatusOk = d.status === true || d.status === 'true' || d.status === 1;
        
        if (currentFilter === 'active') return !isLocked && isStatusOk;
        if (currentFilter === 'locked') return isLocked || !isStatusOk;
        return true;
      });
      
      renderDevices(filtered);
    }

    // Khóa / Mở Khóa TẤT CẢ Thiết Bị (Batch Action Hàng Loạt)
    async function batchToggleLock(targetLockedState) {
      const token = getStoredToken();
      if (!token) {
        showToast('Vui lòng cài đặt GitHub Token trước khi thao tác!', 'error');
        openTokenModal();
        return;
      }

      if (!allDevices || allDevices.length === 0) {
        showToast('Danh sách thiết bị trống, không có gì để thao tác!', 'error');
        return;
      }

      const actionName = targetLockedState === 1 ? 'Khóa' : 'Mở Khóa';
      const confirmMsg = targetLockedState === 1 
        ? `⚠️ Bạn có chắc chắn muốn KHÓA TẤT CẢ (${allDevices.length}) thiết bị không?` 
        : `⚡ Bạn có chắc chắn muốn MỞ KHÓA TẤT CẢ (${allDevices.length}) thiết bị không?`;

      if (!confirm(confirmMsg)) return;

      // Tìm những thiết bị thực tế cần thay đổi trạng thái
      const targets = allDevices.filter(d => {
        const isLocked = d.is_locked === 1 || d.is_locked === '1' || d.is_locked === true;
        const isStatusOk = d.status === true || d.status === 'true' || d.status === 1;
        if (targetLockedState === 1) {
          return !isLocked || isStatusOk; // Máy đang mở -> cần khóa
        } else {
          return isLocked || !isStatusOk; // Máy đang khóa -> cần mở
        }
      });

      if (targets.length === 0) {
        showToast(`Tất cả thiết bị đều đã ở trạng thái ${actionName} rồi!`, 'info');
        return;
      }

      const btnId = targetLockedState === 1 ? 'btn-lock-all' : 'btn-unlock-all';
      const btn = document.getElementById(btnId);
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang ${actionName} ALL...`;
      }

      showToast(`⚡ Đang thực hiện ${actionName} ALL cho ${targets.length} thiết bị...`, 'info');

      // 0ms Optimistic UI: Đổi trạng thái giao diện ngay lập tức
      targets.forEach(dev => {
        dev.is_locked = targetLockedState;
        dev.status = (targetLockedState === 0);
        dev.message = (targetLockedState === 0) ? "Bản quyền hợp lệ" : "Thiết bị đã bị khóa từ xa";
      });
      updateStats(allDevices);
      filterDevices();

      // Đồng bộ tuần tự an toàn lên GitHub REST API (tránh xung đột Git 409 Conflict)
      let successCount = 0;
      let failCount = 0;

      for (const dev of targets) {
        const sn = dev.sn || dev._filename;
        const updatedData = {
          status: targetLockedState === 0,
          is_locked: targetLockedState,
          message: targetLockedState === 0 ? "Bản quyền hợp lệ" : "Thiết bị đã bị khóa từ xa",
          customer_name: dev.customer_name || "Khách",
          note: dev.note || "Litmatch iOS",
          sn: sn
        };

        try {
          const uploadRes = await uploadFileToGitHub(sn, updatedData, dev._sha, `Batch ${actionName} device ${sn} [locked: ${targetLockedState}]`);
          if (uploadRes && uploadRes.content && uploadRes.content.sha) {
            dev._sha = uploadRes.content.sha;
          }
          successCount++;
        } catch (err) {
          console.error(`Lỗi khi batch ${actionName} ${sn}:`, err);
          failCount++;
        }

        // Nghỉ nhẹ 300ms giữa mỗi máy để GitHub xử lý tuần tự commit Git sạch sẽ
        if (targets.length > 1) {
          await new Promise(r => setTimeout(r, 300));
        }
      }

      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }

      if (failCount === 0) {
        showToast(`🎉 Đã ${actionName} ALL thành công toàn bộ ${successCount} thiết bị!`, 'success');
      } else {
        showToast(`Đã ${actionName} ${successCount}/${targets.length} máy (Thất bại: ${failCount})`, 'error');
        refreshData();
      }
    }

    // Toggle Khóa / Mở Khóa với 0ms Optimistic UI
    async function toggleLock(sn, targetLockedState) {
      const token = getStoredToken();
      if (!token) {
        showToast('Vui lòng cài đặt GitHub Token trước khi thao tác!', 'error');
        openTokenModal();
        return;
      }
      
      const dev = allDevices.find(d => (d.sn || d._filename) === sn);
      if (!dev) return;
      
      const actionName = targetLockedState === 1 ? 'Khóa' : 'Mở Khóa';
      showToast(`Đang ${actionName} thiết bị ${sn}...`, 'info');
      
      // Cập nhật giao diện lập tức (0ms)
      dev.is_locked = targetLockedState;
      dev.status = (targetLockedState === 0);
      dev.message = (targetLockedState === 0) ? "Bản quyền hợp lệ" : "Thiết bị đã bị khóa từ xa";
      
      updateStats(allDevices);
      filterDevices();
      
      const updatedData = {
        status: targetLockedState === 0,
        is_locked: targetLockedState,
        message: targetLockedState === 0 ? "Bản quyền hợp lệ" : "Thiết bị đã bị khóa từ xa",
        customer_name: dev.customer_name || "Khách",
        note: dev.note || "Litmatch iOS",
        sn: sn
      };
      
      try {
        const uploadRes = await uploadFileToGitHub(sn, updatedData, dev._sha, `Sync device ${sn} [locked: ${targetLockedState}]`);
        if (uploadRes && uploadRes.content && uploadRes.content.sha) {
          dev._sha = uploadRes.content.sha;
        }
        showToast(`Đã ${actionName} thành công thiết bị ${sn}!`, 'success');
      } catch (err) {
        showToast(`Lỗi khi ${actionName}: ${err.message}`, 'error');
        refreshData();
      }
    }

    // Xóa thiết bị
    async function deleteDevice(sn) {
      const token = getStoredToken();
      if (!token) {
        showToast('Vui lòng cài đặt GitHub Token trước!', 'error');
        openTokenModal();
        return;
      }
      
      if (!confirm(`Bạn có chắc chắn muốn xóa thiết bị ${sn} khỏi hệ thống không?`)) {
        return;
      }
      
      const dev = allDevices.find(d => (d.sn || d._filename) === sn);
      if (!dev) return;
      
      showToast(`Đang xóa thiết bị ${sn}...`, 'info');
      
      // Xóa ngay trên UI (0ms)
      allDevices = allDevices.filter(d => (d.sn || d._filename) !== sn);
      updateStats(allDevices);
      filterDevices();
      
      try {
        await deleteFileOnGitHub(sn, dev._sha, `Delete device ${sn}`);
        showToast(`Đã xóa thiết bị ${sn} thành công!`, 'success');
      } catch (err) {
        showToast(`Lỗi khi xóa: ${err.message}`, 'error');
        refreshData();
      }
    }

    // Tạo thiết bị mới
    async function handleCreateDevice(e) {
      e.preventDefault();
      const token = getStoredToken();
      if (!token) {
        showToast('Vui lòng cài đặt GitHub Token trước!', 'error');
        openTokenModal();
        return;
      }
      
      const sn = document.getElementById('add-sn').value.trim();
      const name = document.getElementById('add-name').value.trim();
      const note = document.getElementById('add-note').value.trim();
      
      if (!sn) {
        showToast('Vui lòng nhập mã máy SN!', 'error');
        return;
      }

      const btn = document.getElementById('btn-submit-add');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Đang thêm...`;
      
      const newDev = {
        status: true,
        is_locked: 0,
        message: "Bản quyền hợp lệ",
        customer_name: name || 'Khách iPhone',
        note: note || 'Litmatch iOS',
        sn: sn
      };
      
      try {
        const uploadRes = await uploadFileToGitHub(sn, newDev, null, `Add customer ${name} (${sn})`);
        newDev._sha = uploadRes.content ? uploadRes.content.sha : null;
        newDev._filename = sn;
        
        allDevices.unshift(newDev);
        updateStats(allDevices);
        filterDevices();
        
        closeAddModal();
        showToast(`Đã thêm và mở khóa thành công cho ${name || sn}!`, 'success');
      } catch (err) {
        showToast('Lỗi khi thêm thiết bị: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Mở Khóa Ngay`;
      }
    }

    // Helper gọi GitHub API PUT (Có cơ chế tự động lấy SHA mới và Retry khi dính 409 Conflict)
    async function uploadFileToGitHub(filename, jsonContent, sha = null, commitMsg = "Update device") {
      const token = getStoredToken();
      const contentStr = JSON.stringify(jsonContent, null, 2);
      const contentB64 = btoa(unescape(encodeURIComponent(contentStr)));
      
      const payload = {
        message: commitMsg,
        content: contentB64,
        branch: GITHUB_BRANCH
      };
      if (sha) {
        payload.sha = sha;
      }
      
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/devices/${filename}`;
      let res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      
      // Tự động khôi phục khi bị 409 Conflict (SHA cũ hoặc race condition)
      if (res.status === 409) {
        try {
          await new Promise(r => setTimeout(r, 350));
          const freshRes = await fetch(`${url}?ref=${GITHUB_BRANCH}&_t=${Date.now()}`, {
            headers: {
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github.v3+json'
            },
            cache: 'no-store'
          });
          if (freshRes.ok) {
            const freshData = await freshRes.json();
            payload.sha = freshData.sha;
            res = await fetch(url, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(payload)
            });
          }
        } catch (retryErr) {
          console.warn('Lỗi auto-retry 409:', retryErr);
        }
      }
      
      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.message || `${res.status} ${res.statusText}`);
      }
      return await res.json();
    }

    // Helper gọi GitHub API DELETE
    async function deleteFileOnGitHub(filename, sha, commitMsg = "Delete device") {
      const token = getStoredToken();
      const payload = {
        message: commitMsg,
        sha: sha,
        branch: GITHUB_BRANCH
      };
      
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/devices/${filename}`;
      const res = await fetch(url, {
        method: 'DELETE',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      
      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.message || `${res.status} ${res.statusText}`);
      }
      return await res.json();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
